<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SurakshaNetra - Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<>

    <div class="login-page">

        <div class="background-overlay"></div>

        <!-- TOP BRAND -->
        <header class="navbar">

            <img src="LOGO.png" alt="SurakshaNetra Logo">

            <span>SurakshaNetra</span>

        </header>


        <!-- LOGIN -->
        <div class="login-container">

            <div class="login-box">

                <div class="login-label">
                    SECURE ACCESS TERMINAL
                </div>

                <h1>Welcome, Officer</h1>

                <p class="login-subtitle">
                    Log in to your Military Secure Terminal to continue
                </p>


                <form id="loginForm">

    <div class="input-group">

        <label for="officerName">
            Officer Name
        </label>

        <input
            type="text"
            id="officerName"
            placeholder="Enter your full name"
            required
        >

    </div>


    <div class="input-group">

        <label for="militaryUID">
            Military UID
        </label>

        <input
            type="text"
            id="militaryUID"
            placeholder="Enter unique ID"
            required
        >

    </div>


    <div class="input-group">

        <label for="officerRank">
            Officer Rank
        </label>

        <input
            type="text"
            id="officerRank"
            placeholder="Enter your rank"
            required
        >

    </div>


    <div class="input-group">

        <label for="password">
            Special Access Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter special key"
            required
        >

    </div>


    <div class="login-options">

        <label class="remember">

            <input
                type="checkbox"
                id="rememberMe"
            >

            <span>Remember me</span>

        </label>


        <a
            href="#"
            id="forgotPassword"
        >
            Forgot password?
        </a>

    </div>


    <button
        type="submit"
        class="login-button"
    >
        LOG IN
    </button>

</form>

                <div class="security-line">

                    <span></span>

                    <small>
                        AUTHORIZED PERSONNEL ONLY
                    </small>

                    <span></span>

                </div>

            </div>

        </div>

    </div>
    <script src="login.js"></script>

</body>

</html>
